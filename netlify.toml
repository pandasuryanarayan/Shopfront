[build]
  publish = "public"
  command = "echo 'Shopfront: no build step — static frontend + one serverless function'"

[functions]
  directory = "netlify/functions"
  # esbuild bundles the ESM entry point (zisi wraps it in require(), which fails)
  node_bundler = "esbuild"
  # sql.js loads its wasm at runtime; ship it alongside the bundle
  included_files = ["node_modules/sql.js/dist/sql-wasm.wasm"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/mukhiya"
  to = "/mukhiya.html"
  status = 200

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
